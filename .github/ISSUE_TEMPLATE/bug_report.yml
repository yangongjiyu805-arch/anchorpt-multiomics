name: Bug report
description: Installation, training, or evaluation problem.
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Problem and reproduction
      description: Command, expected/observed behavior, parameters, and input shape.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, entry point, OS, Python/packages, GPU and driver.
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or logs
      render: text
